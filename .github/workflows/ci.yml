name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI: true
  GITHUB_ACTIONS: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true
          install_args: rust
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure rustfmt and clippy are installed
        run: rustup component add rustfmt clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Rustfmt Check
        run: cargo fmt --all -- --check

      - name: Run clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

  msrv:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - toolchain: stable
          - toolchain: stable minus 1 releases
          - toolchain: stable minus 2 releases
          - toolchain: stable minus 3 releases
          - toolchain: stable minus 4 releases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          components: rustfmt, clippy
          toolchain: ${{ matrix.toolchain }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check MSRV compliance
        run: cargo check --all-features

  test:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true
          install_args: just zig rust cargo-binstall cargo:cargo-nextest
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate test fixtures
        run: just gen-fixtures

      - name: Run tests (all features)
        run: just test-ci

      - name: Build release
        run: just build-release

  test-cross-platform:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: "Linux"
          - os: macos-latest
            platform: "macOS"
          - os: windows-latest
            platform: "Windows"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true
          install_args: just zig rust cargo-binstall cargo:cargo-nextest
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate test fixtures
        run: just gen-fixtures

      - name: Run tests (all features)
        run: just test-ci
      - name: Build release
        run: just build-release

  coverage:
    runs-on: ubuntu-latest
    needs: [test, test-cross-platform]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: true
          install_args: just zig rust cargo-binstall cargo:cargo-llvm-cov
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate test fixtures
        run: just gen-fixtures

      - name: Generate coverage
        run: just coverage

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: EvilBit-Labs/Stringy
