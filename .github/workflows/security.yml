name: Security

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install: true
          install_args: just rust cargo-binstall cargo:cargo-deny cargo:cargo-outdated cargo:cargo-dist
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run cargo deny check
        run: just deny

      - name: Run cargo outdated
        run: just outdated

      - name: Run cargo dist plan
        run: just dist-check
